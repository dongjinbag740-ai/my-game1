<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지옥의 우주 전투</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #111; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; font-family: 'Arial', sans-serif; overflow: hidden;
            touch-action: none; user-select: none;
        }

        #lobbyScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #333 0%, #000 100%); z-index: 10;
        }
        #lobbyScreen h1 { font-size: 45px; color: #FFD700; text-shadow: 0 0 20px #ff3333; margin-bottom: 10px; text-align: center; }
        #lobbyScreen .subtitle { font-size: 16px; color: #ccc; margin-bottom: 50px; text-align: center; }
        #startBtn { padding: 15px 40px; font-size: 24px; font-weight: bold; color: white; background-color: #ff3333; border: 3px solid #fff; border-radius: 15px; cursor: pointer; box-shadow: 0 0 15px #ff3333; transition: transform 0.2s; }
        #startBtn:hover { transform: scale(1.1); }

        #uiBoard {
            font-size: 16px; font-weight: bold; margin-bottom: 10px;
            background-color: #222; padding: 10px 15px; border-radius: 8px; border: 2px solid #555;
            width: 100%; max-width: 500px; text-align: center; box-sizing: border-box;
            flex-shrink: 0; z-index: 5;
        }
        #scoreBoard { color: #00ffff; } #lifeBoard { color: #ff3333; } #bombBoard { color: #ffaa00; }

        canvas {
            background-color: #050510; border: 3px solid #555; border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            display: block; /* 캔버스 기본 여백 제거 */
        }

        .instructions { margin-top: 10px; font-size: 14px; color: #aaa; text-align: center; flex-shrink: 0; }

        #mobileControls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 500px; padding: 10px 20px; box-sizing: border-box;
            flex-shrink: 0;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); gap: 5px; }
        #btnUp { grid-column: 2; grid-row: 1; } #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; } #btnDown { grid-column: 2; grid-row: 3; }
        .action-pad { display: flex; gap: 15px; align-items: flex-end; padding-bottom: 10px; }

        .control-btn {
            width: 55px; height: 55px; border-radius: 50%; font-size: 22px;
            border: none; background-color: rgba(255, 255, 255, 0.2);
            color: white; cursor: pointer; backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active { background-color: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
        .fire-btn { background-color: rgba(255, 51, 51, 0.4); width: 70px; height: 70px; font-size: 28px; } 
        .fire-btn:active { background-color: rgba(255, 51, 51, 0.8); }
        .bomb-btn { background-color: rgba(255, 170, 0, 0.4); width: 60px; height: 60px; margin-bottom: 5px; } 
        .bomb-btn:active { background-color: rgba(255, 170, 0, 0.8); }

        #resultScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 20; backdrop-filter: blur(4px);
        }
        #resultTitle { font-size: 55px; margin-bottom: 10px; text-align: center; }
        #resultScore { font-size: 24px; color: white; margin-bottom: 40px; }
        #restartBtn { 
            padding: 15px 40px; font-size: 24px; font-weight: bold; color: white; 
            background-color: #555; border: 3px solid #fff; border-radius: 15px; 
            cursor: pointer; transition: all 0.2s; 
        }
        #restartBtn:hover { background-color: #777; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1>🚀 SPACE HELL 🚀</h1>
        <p class="subtitle">우주를 집어삼키는 보스들을 물리치세요!</p>
        <button id="startBtn">게임 시작</button>
    </div>

    <div id="uiBoard" style="display: none;">
        <span id="scoreBoard">점수: 0</span> &nbsp;|&nbsp; 
        <span id="lifeBoard">생명: ❤️❤️</span> &nbsp;|&nbsp;
        <span id="bombBoard">폭탄(B): 💣💣</span>
    </div>
    
    <!-- 이 캔버스 태그가 모든 그림을 그리는 핵심 도화지입니다. -->
    <canvas id="gameCanvas" style="display: none;"></canvas>
    
    <div id="mobileControls" style="display: none;">
        <div class="d-pad">
            <button id="btnUp" class="control-btn">⬆️</button>
            <button id="btnLeft" class="control-btn">⬅️</button>
            <button id="btnRight" class="control-btn">➡️</button>
            <button id="btnDown" class="control-btn">⬇️</button>
        </div>
        <div class="action-pad">
            <button id="btnBomb" class="control-btn bomb-btn">💣</button>
            <button id="btnFire" class="control-btn fire-btn">🔥</button>
        </div>
    </div>

    <div id="resultScreen" style="display: none;">
        <h1 id="resultTitle">YOU DIED</h1>
        <p id="resultScore">최종 점수: 0점</p>
        <button id="restartBtn">다시 시작하기</button>
    </div>

    <div class="instructions" id="pcInstructions" style="display: none;">
        <p>PC: ⬅️➡️⬆️⬇️ 이동 | Space 공격 | B 폭탄</p>
    </div>

    <script>
        // 요소 가져오기 (body 태그 끝에 있으므로 무조건 찾을 수 있습니다)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreBoard');
        const lifeElement = document.getElementById('lifeBoard');
        const bombElement = document.getElementById('bombBoard');

        const lobbyScreen = document.getElementById('lobbyScreen');
        const startBtn = document.getElementById('startBtn');
        const uiBoard = document.getElementById('uiBoard');
        const mobileControls = document.getElementById('mobileControls');
        const pcInstructions = document.getElementById('pcInstructions');

        const resultScreen = document.getElementById('resultScreen');
        const resultTitle = document.getElementById('resultTitle');
        const resultScore = document.getElementById('resultScore');
        const restartBtn = document.getElementById('restartBtn');

        // 반응형 리사이즈 로직
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        function resizeCanvas() {
            const paddingY = isTouchDevice ? 250 : 120; // 모바일 컨트롤러 고려
            let newWidth = window.innerWidth > 550 ? 500 : window.innerWidth * 0.95;
            let newHeight = window.innerHeight - paddingY;
            if (newHeight > 800) newHeight = 800; 
            
            canvas.width = newWidth;
            canvas.height = newHeight;

            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height - 20;
            if (player.x > canvas.width - player.width) player.x = canvas.width / 2 - player.width / 2;
        }
        window.addEventListener('resize', resizeCanvas);

        // 게임 상태 변수 (⭐ 중간 난이도 기준)
        let score = 0, lives = 3, bombs = 3, gameOver = false, gameStarted = false; 
        const player = { x: 0, y: 0, width: 40, height: 40, speed: 6 }; 

        let bullets = [], enemies = [], explosions = [], bossBullets = [], stars = [], planets = [], items = [];
        let weaponLevel = 1, invincibilityTimer = 0; 
        let rightPressed = false, leftPressed = false, upPressed = false, downPressed = false;
        let spacePressed = false, fireCooldown = 0, flashAlpha = 0;

        // 보스 데이터
        const bossStages = [
            { type: 1, scoreReq: 200, hp: 200, speedX: 3, bulletFreq: 0.05, spread: 3, bulletSpeed: 4.5 },  
            { type: 2, scoreReq: 600, hp: 500, speedX: 4.5, bulletFreq: 0.10, spread: 5, bulletSpeed: 6 }, 
            { type: 3, scoreReq: 1200, hp: 1000, speedX: 6, bulletFreq: 0.20, spread: 7, bulletSpeed: 7.5 }  
        ];
        let currentBossIndex = 0, boss = null, bossActive = false, gameClear = false;

        function drawPlayerJet(ctx, x, y, w, h) {
            ctx.save(); ctx.translate(x, y); ctx.scale(w / 60, h / 60);
            
            // 엔진 불꽃 (반짝이는 연출)
            ctx.fillStyle = (Math.random() > 0.5) ? '#ffaa00' : '#ff3300';
            ctx.beginPath(); ctx.moveTo(22, 55); ctx.lineTo(30, 65 + Math.random() * 10); ctx.lineTo(38, 55); ctx.fill();

            // 주 날개
            ctx.fillStyle = '#1e90ff';
            ctx.beginPath(); ctx.moveTo(30, 15); ctx.lineTo(60, 45); ctx.lineTo(38, 45); 
            ctx.lineTo(30, 50); ctx.lineTo(22, 45); ctx.lineTo(0, 45); ctx.fill();

            // 동체
            ctx.fillStyle = '#eeeeee';
            ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(38, 20); ctx.lineTo(38, 55); 
            ctx.lineTo(22, 55); ctx.lineTo(22, 20); ctx.fill();

            // 캐노피
            ctx.fillStyle = '#00ffff';
            ctx.beginPath(); ctx.ellipse(30, 25, 5, 12, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.ellipse(30, 20, 2, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawEnemy(ctx, x, y, w, h) {
            ctx.save(); ctx.translate(x, y); ctx.scale(w / 60, h / 60);
            ctx.fillStyle = '#ff3333';
            ctx.beginPath(); ctx.moveTo(5, 15); ctx.lineTo(55, 15); ctx.lineTo(40, 50); ctx.lineTo(20, 50); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(20, 35, 5, 0, Math.PI * 2); ctx.arc(40, 35, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawBoss(ctx, type, x, y, w, h) {
            ctx.save(); ctx.translate(x, y); ctx.scale(w / 80, h / 80);
            if (type === 1) {
                ctx.fillStyle = 'purple'; ctx.beginPath(); ctx.ellipse(40, 40, 35, 25, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.arc(25, 45, 5, 0, Math.PI * 2); ctx.arc(55, 45, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'darkmagenta'; ctx.fillRect(30, 15, 20, 15);
            } else if (type === 2) {
                ctx.fillStyle = '#8B0000'; ctx.beginPath(); ctx.moveTo(40, 10); ctx.lineTo(75, 40); ctx.lineTo(60, 70); ctx.lineTo(20, 70); ctx.lineTo(5, 40); ctx.fill();
                ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.moveTo(25, 50); ctx.lineTo(35, 45); ctx.lineTo(30, 55); ctx.fill();
                ctx.beginPath(); ctx.moveTo(55, 50); ctx.lineTo(45, 45); ctx.lineTo(50, 55); ctx.fill();
            } else {
                ctx.fillStyle = '#FFD700'; ctx.fillRect(10, 20, 60, 40);
                ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(40, 5); ctx.lineTo(70, 20); ctx.fill();
                ctx.beginPath(); ctx.moveTo(10, 60); ctx.lineTo(40, 75); ctx.lineTo(70, 60); ctx.fill();
                ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(40, 40, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(40, 40, 5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawExplosion(ctx, x, y, size, alpha) {
            ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
            const spikes = 8, outer = size / 2, inner = size / 4;
            ctx.fillStyle = '#ff8800'; ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                let radius = i % 2 === 0 ? outer : inner;
                let angle = (i * Math.PI) / spikes;
                ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
            }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(0, 0, inner * 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        startBtn.addEventListener('click', () => {
            lobbyScreen.style.display = 'none'; 
            uiBoard.style.display = 'block';    
            canvas.style.display = 'block'; 
            
            if (isTouchDevice) { mobileControls.style.display = 'flex'; pcInstructions.style.display = 'none'; } 
            else { mobileControls.style.display = 'none'; pcInstructions.style.display = 'block'; }
            
            resizeCanvas();
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 80;
            
            for (let i = 0; i < 100; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 0.5, speed: Math.random() * 3 + 1, alpha: Math.random() });
            
            gameStarted = true; updateUI(); gameLoop(); 
        });

        restartBtn.addEventListener('click', () => { location.reload(); });

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return; 
            if ([' ', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
            if (e.key === 'ArrowRight') rightPressed = true; if (e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'ArrowUp') upPressed = true; if (e.key === 'ArrowDown') downPressed = true;
            if (e.key === ' ') spacePressed = true;
            if ((e.key === 'b' || e.key === 'B') && !gameOver && !gameClear && bombs > 0) useBomb();
        }, { passive: false });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted) return;
            if (e.key === 'ArrowRight') rightPressed = false; if (e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'ArrowUp') upPressed = false; if (e.key === 'ArrowDown') downPressed = false;
            if (e.key === ' ') spacePressed = false;
        });

        const bindTouch = (id, downFn, upFn) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); downFn(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); upFn(); });
            btn.addEventListener('mousedown', downFn); btn.addEventListener('mouseup', upFn); btn.addEventListener('mouseleave', upFn);
        };
        bindTouch('btnLeft', () => leftPressed = true, () => leftPressed = false);
        bindTouch('btnRight', () => rightPressed = true, () => rightPressed = false);
        bindTouch('btnUp', () => upPressed = true, () => upPressed = false);
        bindTouch('btnDown', () => downPressed = true, () => downPressed = false);
        bindTouch('btnFire', () => spacePressed = true, () => spacePressed = false);
        
        const btnBomb = document.getElementById('btnBomb');
        const triggerBomb = (e) => { if(e) e.preventDefault(); if(gameStarted && !gameOver && !gameClear && bombs > 0) useBomb(); };
        btnBomb.addEventListener('touchstart', triggerBomb); btnBomb.addEventListener('mousedown', triggerBomb);

        function updateUI() {
            let hearts = ''; for (let i = 0; i < lives; i++) hearts += '❤️';
            let bombIcons = ''; for (let i = 0; i < bombs; i++) bombIcons += '💣';
            scoreElement.innerText = `점수: ${score}`; lifeElement.innerText = `생명: ${hearts}`; bombElement.innerText = `폭탄(B): ${bombIcons}`;
        }

        function createExplosionObj(x, y, size) { explosions.push({ x: x, y: y, timer: 15, maxTimer: 15, size: size }); }

        function useBomb() {
            bombs--; updateUI(); flashAlpha = 1; 
            enemies.forEach(e => { createExplosionObj(e.x + e.width / 2, e.y + e.height / 2, 1); spawnItemFromEnemy(e.x, e.y); score += 10; });
            enemies = []; bossBullets = []; 
            if (bossActive && boss) { boss.hp -= 50; createExplosionObj(boss.x + boss.width / 2, boss.y + boss.height / 2, 3); if (boss.hp <= 0) defeatBoss(); }
        }

        function getRandomItemType() {
            let r = Math.random();
            if (r < 0.15) return 'life'; if (r < 0.30) return 'bomb'; if (r < 0.45) return 'shield';    
            if (r < 0.60) return 'speed'; if (r < 0.75) return 'coin'; return 'power';                      
        }

        function spawnItemFromEnemy(x, y) { if (Math.random() < 0.20) items.push({ x: x, y: y, width: 30, height: 30, speed: 2, type: getRandomItemType() }); }
        
        let itemTimer = 0, enemyTimer = 0;
        
        function spawnBoss(stage) {
            bossActive = true;
            boss = { x: canvas.width / 2 - 40, y: -100, width: 80, height: 80, hp: stage.hp, maxHp: stage.hp, speedX: stage.speedX, speedY: 2.5, type: stage.type, bulletFreq: stage.bulletFreq, spread: stage.spread, bulletSpeed: stage.bulletSpeed };
        }

        function defeatBoss() {
            createExplosionObj(boss.x + boss.width / 2, boss.y + boss.height / 2, 5);
            score += 300 * (currentBossIndex + 1); currentBossIndex++; 
            bossActive = false; boss = null; bossBullets = []; 
            if (currentBossIndex >= bossStages.length && !gameClear) {
                gameClear = true;
                setTimeout(() => { 
                    resultScreen.style.display = 'flex'; resultTitle.innerText = '🌟 GOD OF SPACE 🌟';
                    resultTitle.style.color = '#FFD700'; resultScore.innerText = `최종 점수: ${score}점`;
                }, 1500);
            }
            updateUI();
        }

        function isColliding(r1, r2) { return ( r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y ); }

        function playerTakeDamage() {
            createExplosionObj(player.x + player.width/2, player.y + player.height/2, 1.5); 
            lives--; weaponLevel = 1; player.speed = 6; updateUI();
            if (lives <= 0 && !gameOver) {
                gameOver = true;
                setTimeout(() => { 
                    resultScreen.style.display = 'flex'; resultTitle.innerText = '💀 YOU DIED 💀';
                    resultTitle.style.color = '#ff3333'; resultScore.innerText = `최종 점수: ${score}점`;
                }, 1000);
            } else if (lives > 0) invincibilityTimer = 60; 
        }

        function update() {
            if (gameOver || gameClear) return;
            if (invincibilityTimer > 0) invincibilityTimer--;

            // 이동
            if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
            if (leftPressed && player.x > 0) player.x -= player.speed;
            if (upPressed && player.y > 0) player.y -= player.speed;
            if (downPressed && player.y < canvas.height - player.height) player.y += player.speed;
            
            // 공격
            if (fireCooldown > 0) fireCooldown--; 
            if (spacePressed && fireCooldown <= 0) {
                let bw = 6, bh = 20, bs = 10;
                if (weaponLevel === 1) {
                    bullets.push({ x: player.x + player.width / 2 - bw/2, y: player.y, width: bw, height: bh, speed: bs, speedX: 0 });
                } else if (weaponLevel === 2) {
                    bullets.push({ x: player.x + 5, y: player.y + 10, width: bw, height: bh, speed: bs, speedX: 0 });
                    bullets.push({ x: player.x + player.width - 5 - bw, y: player.y + 10, width: bw, height: bh, speed: bs, speedX: 0 });
                } else {
                    bullets.push({ x: player.x + player.width / 2 - bw/2, y: player.y, width: bw, height: bh, speed: bs, speedX: 0 });
                    bullets.push({ x: player.x, y: player.y + 15, width: bw, height: bh, speed: bs, speedX: -2 }); 
                    bullets.push({ x: player.x + player.width - bw, y: player.y + 15, width: bw, height: bh, speed: bs, speedX: 2 }); 
                }
                fireCooldown = 5; 
            }
            if (flashAlpha > 0) flashAlpha -= 0.05;

            // 배경 별
            stars.forEach(star => { star.y += star.speed; if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; } });
            if (Math.random() < 0.01 && planets.length < 2) planets.push({ x: Math.random() * canvas.width, y: -100, radius: Math.random() * 40 + 20, speed: Math.random() * 0.5 + 0.2, color: `hsl(${Math.random() * 360}, 60%, 30%)` });
            for (let i = 0; i < planets.length; i++) { planets[i].y += planets[i].speed; if (planets[i].y - planets[i].radius > canvas.height) { planets.splice(i, 1); i--; } }

            // 보스 소환
            if (currentBossIndex < bossStages.length && score >= bossStages[currentBossIndex].scoreReq && !bossActive) spawnBoss(bossStages[currentBossIndex]);
            
            // 내 총알
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].y -= bullets[i].speed; bullets[i].x += bullets[i].speedX; 
                if (bullets[i].y < 0 || bullets[i].x < 0 || bullets[i].x > canvas.width) { bullets.splice(i, 1); i--; }
            }
            
            // 폭발 이펙트
            for (let i = 0; i < explosions.length; i++) { explosions[i].timer--; if (explosions[i].timer <= 0) { explosions.splice(i, 1); i--; } }

            // 아이템
            itemTimer++; if (itemTimer % 350 === 0) items.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 30, height: 30, speed: 2, type: getRandomItemType() });
            for (let i = 0; i < items.length; i++) {
                items[i].y += items[i].speed;
                if (isColliding(player, items[i])) {
                    let type = items[i].type;
                    if (type === 'life') lives++; else if (type === 'bomb') bombs++;
                    else if (type === 'power') weaponLevel = Math.min(weaponLevel + 1, 3); 
                    else if (type === 'shield') invincibilityTimer = 300; 
                    else if (type === 'speed') player.speed = Math.min(player.speed + 1.5, 12); 
                    else if (type === 'coin') score += 500; 
                    createExplosionObj(items[i].x + 15, items[i].y + 15, 0.5); updateUI(); items.splice(i, 1); i--; continue;
                }
                if (items[i].y > canvas.height) { items.splice(i, 1); i--; }
            }

            // 일반 적
            if (!bossActive) { enemyTimer++; if (enemyTimer % 30 === 0) enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 30, height: 30, speed: 2 + Math.random() * 2.5 }); }
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;
                if (isColliding(player, enemies[i])) { 
                    if (invincibilityTimer <= 0) playerTakeDamage(); 
                    else { createExplosionObj(enemies[i].x + 15, enemies[i].y + 15, 1); score += 10; updateUI(); }
                    enemies.splice(i, 1); i--; continue; 
                }

                let enemyDestroyed = false;
                for (let j = 0; j < bullets.length; j++) {
                    if (isColliding(bullets[j], enemies[i])) {
                        createExplosionObj(enemies[i].x + 15, enemies[i].y + 15, 1); spawnItemFromEnemy(enemies[i].x, enemies[i].y);
                        enemies.splice(i, 1); bullets.splice(j, 1); score += 10; updateUI(); enemyDestroyed = true; break;
                    }
                }
                if (enemyDestroyed) { i--; continue; }
                if (enemies[i] && enemies[i].y > canvas.height) { enemies.splice(i, 1); i--; }
            }

            // 보스 로직
            if (bossActive && boss) {
                if (boss.y < 50) boss.y += boss.speedY; 
                else {
                    boss.x += boss.speedX;
                    if (boss.x <= 0 || boss.x + boss.width >= canvas.width) boss.speedX *= -1;
                    if (Math.random() < boss.bulletFreq) {
                        const cx = boss.x + boss.width / 2 - 5, by = boss.y + boss.height, sy = boss.bulletSpeed;
                        if (boss.spread === 1) bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 0, speedY: sy });
                        else if (boss.spread === 3) {
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: -2.5, speedY: sy });
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 0, speedY: sy });
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 2.5, speedY: sy });
                        } else if (boss.spread === 5) {
                            for(let k = -2; k <= 2; k++) bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: k * 2, speedY: sy });
                        } else if (boss.spread === 7) { 
                            for(let k = -3; k <= 3; k++) bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: k * 2, speedY: sy });
                        }
                    }
                }
                for (let j = 0; j < bullets.length; j++) {
                    if (isColliding(bullets[j], boss)) {
                        boss.hp -= 10; createExplosionObj(bullets[j].x, bullets[j].y, 0.5); bullets.splice(j, 1); j--;
                        if (boss.hp <= 0) { defeatBoss(); break; }
                    }
                }
                if (boss && isColliding(player, boss) && invincibilityTimer <= 0) playerTakeDamage();
            }
            
            // 보스 총알
            for (let i = 0; i < bossBullets.length; i++) {
                bossBullets[i].x += bossBullets[i].speedX; bossBullets[i].y += bossBullets[i].speedY;
                if (isColliding(bossBullets[i], player)) { 
                    bossBullets.splice(i, 1); if (invincibilityTimer <= 0) playerTakeDamage(); i--; continue; 
                }
                if (bossBullets[i] && bossBullets[i].y > canvas.height) { bossBullets.splice(i, 1); i--; }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 우주 배경
            stars.forEach(star => { ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`; ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill(); });
            planets.forEach(planet => {
                ctx.fillStyle = planet.color; ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(planet.x - planet.radius * 0.3, planet.y - planet.radius * 0.3, planet.radius * 0.2, 0, Math.PI * 2); ctx.fill();
            });

            // 플레이어
            if (!gameOver) {
                drawPlayerJet(ctx, player.x, player.y, player.width, player.height);
                if (invincibilityTimer > 0) {
                    ctx.beginPath(); ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${0.3 + Math.sin(Date.now() / 100) * 0.2})`; ctx.fill();
                    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
                }
            }
            
            // 총알 및 적
            ctx.fillStyle = '#ffff00'; ctx.shadowBlur = 10; ctx.shadowColor = "orange";
            bullets.forEach(b => { ctx.fillRect(b.x, b.y, b.width, b.height); });
            ctx.shadowBlur = 0;
            
            enemies.forEach(e => drawEnemy(ctx, e.x, e.y, e.width, e.height));

            // 아이템
            items.forEach(item => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(item.x + 15, item.y + 15, 15, 0, Math.PI * 2); ctx.fill();
                ctx.font = '18px Arial'; ctx.textAlign = 'center';
                let icon = '⚡'; 
                if (item.type === 'life') icon = '❤️'; else if (item.type === 'bomb') icon = '💣';
                else if (item.type === 'shield') icon = '🛡️'; else if (item.type === 'speed') icon = '💨'; else if (item.type === 'coin') icon = '💰';
                ctx.fillText(icon, item.x + 15, item.y + 21);
            });

            // 보스
            ctx.fillStyle = '#ff00ff';
            bossBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x + b.width/2, b.y + b.height/2, b.width/2, 0, Math.PI * 2); ctx.fill(); });

            if (bossActive && boss) {
                drawBoss(ctx, boss.type, boss.x, boss.y, boss.width, boss.height);
                ctx.fillStyle = 'black'; ctx.fillRect(boss.x, boss.y - 15, boss.width, 10);
                ctx.fillStyle = 'red'; const hpWidth = (boss.hp / boss.maxHp) * boss.width;
                if(hpWidth > 0) ctx.fillRect(boss.x, boss.y - 15, hpWidth, 10);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`🔥 STAGE ${currentBossIndex + 1} BOSS 🔥`, boss.x + boss.width / 2, boss.y - 25);
            }

            // 폭발
            explosions.forEach(exp => {
                const size = (exp.maxTimer - exp.timer) * 4 * exp.size; const alpha = exp.timer / exp.maxTimer;
                drawExplosion(ctx, exp.x + 15, exp.y + 15, size, alpha);
            });

            // 번쩍임 효과
            if (flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        }

        function gameLoop() { 
            update(); draw(); 
            if ((!gameOver && !gameClear) || explosions.length > 0) requestAnimationFrame(gameLoop); 
        }
    </script>
</body>
</html>
