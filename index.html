<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지옥의 우주 전투</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #222; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh; /* 모바일 주소창 영역 고려 */
            font-family: 'Arial', sans-serif; overflow: hidden;
            touch-action: none; user-select: none;
        }

        #lobbyScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #333 0%, #000 100%); z-index: 10;
        }
        #lobbyScreen h1 { font-size: 45px; color: #FFD700; text-shadow: 0 0 20px #ff3333; margin-bottom: 10px; text-align: center; }
        #lobbyScreen .subtitle { font-size: 16px; color: #ccc; margin-bottom: 50px; text-align: center; }
        #startBtn { padding: 15px 40px; font-size: 24px; font-weight: bold; color: white; background-color: #ff3333; border: 3px solid #fff; border-radius: 15px; cursor: pointer; box-shadow: 0 0 15px #ff3333; transition: transform 0.2s; }
        #startBtn:hover { transform: scale(1.1); }

        #uiBoard {
            font-size: 16px; font-weight: bold; margin-bottom: 10px;
            background-color: #111; padding: 10px 15px; border-radius: 8px; border: 2px solid #555;
            width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; flex-shrink: 0;
        }
        #scoreBoard { color: #00ffff; } #lifeBoard { color: #ff3333; } #bombBoard { color: #ffaa00; }

        canvas {
            background-color: #000; border: 3px solid #555; border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            /* 크기는 화면 크기에 맞춰 자바스크립트가 자동 조정합니다 */
        }

        .instructions { margin-top: 10px; font-size: 14px; color: #aaa; text-align: center; flex-shrink: 0; }

        /* 📱 모바일 가상 조이스틱 스타일 */
        #mobileControls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 500px; padding: 10px 20px; box-sizing: border-box; flex-shrink: 0;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        #btnUp { grid-column: 2; grid-row: 1; } #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; } #btnDown { grid-column: 2; grid-row: 3; }
        .action-pad { display: flex; gap: 15px; align-items: flex-end; padding-bottom: 10px; }

        .control-btn {
            width: 50px; height: 50px; border-radius: 50%; font-size: 20px;
            border: none; background-color: rgba(255, 255, 255, 0.2);
            color: white; cursor: pointer; backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active { background-color: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
        .fire-btn { background-color: rgba(255, 51, 51, 0.4); width: 65px; height: 65px; font-size: 26px; } 
        .fire-btn:active { background-color: rgba(255, 51, 51, 0.8); }
        .bomb-btn { background-color: rgba(255, 170, 0, 0.4); width: 55px; height: 55px; margin-bottom: 5px; } 
        .bomb-btn:active { background-color: rgba(255, 170, 0, 0.8); }

        /* 🏁 게임 오버/클리어 화면 */
        #resultScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 20; backdrop-filter: blur(4px);
        }
        #resultTitle { font-size: 55px; margin-bottom: 10px; text-align: center; }
        #resultScore { font-size: 24px; color: white; margin-bottom: 40px; }
        #restartBtn { 
            padding: 15px 40px; font-size: 24px; font-weight: bold; color: white; 
            background-color: #555; border: 3px solid #fff; border-radius: 15px; 
            cursor: pointer; transition: all 0.2s; 
        }
        #restartBtn:hover { background-color: #777; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1>🚀 SPACE HELL 🚀</h1>
        <p class="subtitle">우주를 집어삼키는 보스들을 물리치세요!</p>
        <button id="startBtn">게임 시작</button>
    </div>

    <div id="uiBoard" style="display: none;">
        <span id="scoreBoard">점수: 0</span> &nbsp;|&nbsp; 
        <span id="lifeBoard">생명: ❤️❤️</span> &nbsp;|&nbsp;
        <span id="bombBoard">폭탄(B): 💣💣</span>
    </div>
    
    <canvas id="gameCanvas" style="display: none;"></canvas>
    
    <div id="mobileControls" style="display: none;">
        <div class="d-pad">
            <button id="btnUp" class="control-btn">⬆️</button>
            <button id="btnLeft" class="control-btn">⬅️</button>
            <button id="btnRight" class="control-btn">➡️</button>
            <button id="btnDown" class="control-btn">⬇️</button>
        </div>
        <div class="action-pad">
            <button id="btnBomb" class="control-btn bomb-btn">💣</button>
            <button id="btnFire" class="control-btn fire-btn">🔥</button>
        </div>
    </div>

    <div id="resultScreen" style="display: none;">
        <h1 id="resultTitle">YOU DIED</h1>
        <p id="resultScore">최종 점수: 0점</p>
        <button id="restartBtn">다시 시작하기</button>
    </div>

    <div class="instructions" id="pcInstructions" style="display: none;">
        <p>PC: ⬅️➡️⬆️⬇️ 이동 | Space 공격 | B 폭탄</p>
    </div>

    <script>
        // HTML 요소 가져오기 (오류 방지를 위해 onload 제거하고 바로 실행)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreBoard');
        const lifeElement = document.getElementById('lifeBoard');
        const bombElement = document.getElementById('bombBoard');

        const lobbyScreen = document.getElementById('lobbyScreen');
        const startBtn = document.getElementById('startBtn');
        const uiBoard = document.getElementById('uiBoard');
        const mobileControls = document.getElementById('mobileControls');
        const pcInstructions = document.getElementById('pcInstructions');

        const resultScreen = document.getElementById('resultScreen');
        const resultTitle = document.getElementById('resultTitle');
        const resultScore = document.getElementById('resultScore');
        const restartBtn = document.getElementById('restartBtn');

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // 🎨 모든 오브젝트를 벡터로 직접 그리는 함수들 (이미지 파일 필요 없음!)
        function drawPlayerJet(ctxP, x, y, w, h) {
            ctxP.save(); ctxP.translate(x, y); ctxP.scale(w / 60, h / 60);
            ctxP.fillStyle = (Math.random() > 0.5) ? '#ffaa00' : '#ff3300';
            ctxP.beginPath(); ctxP.moveTo(22, 55); ctxP.lineTo(30, 65 + Math.random() * 8); ctxP.lineTo(38, 55); ctxP.fill();
            ctxP.fillStyle = '#1e90ff';
            ctxP.beginPath(); ctxP.moveTo(30, 15); ctxP.lineTo(60, 45); ctxP.lineTo(38, 45); ctxP.lineTo(30, 50); ctxP.lineTo(22, 45); ctxP.lineTo(0, 45); ctxP.fill();
            ctxP.fillStyle = '#eeeeee';
            ctxP.beginPath(); ctxP.moveTo(30, 0); ctxP.lineTo(38, 20); ctxP.lineTo(38, 55); ctxP.lineTo(22, 55); ctxP.lineTo(22, 20); ctxP.fill();
            ctxP.fillStyle = '#aaaaaa';
            ctxP.beginPath(); ctxP.moveTo(30, 0); ctxP.lineTo(34, 20); ctxP.lineTo(34, 55); ctxP.lineTo(26, 55); ctxP.lineTo(26, 20); ctxP.fill();
            ctxP.fillStyle = '#0055a4';
            ctxP.beginPath(); ctxP.moveTo(26, 45); ctxP.lineTo(10, 58); ctxP.lineTo(26, 55); ctxP.fill();
            ctxP.beginPath(); ctxP.moveTo(34, 45); ctxP.lineTo(50, 58); ctxP.lineTo(34, 55); ctxP.fill();
            ctxP.fillStyle = '#00ffff';
            ctxP.beginPath(); ctxP.ellipse(30, 25, 5, 12, 0, 0, Math.PI * 2); ctxP.fill();
            ctxP.fillStyle = '#ffffff';
            ctxP.beginPath(); ctxP.ellipse(30, 20, 2, 5, 0, 0, Math.PI * 2); ctxP.fill();
            ctxP.restore();
        }

        function drawEnemy(ctxE, x, y, w, h) {
            ctxE.save(); ctxE.translate(x, y); ctxE.scale(w / 60, h / 60);
            ctxE.fillStyle = '#ff3333';
            ctxE.beginPath(); ctxE.moveTo(5, 15); ctxE.lineTo(55, 15); ctxE.lineTo(40, 50); ctxE.lineTo(20, 50); ctxE.fill();
            ctxE.fillStyle = 'yellow'; ctxE.beginPath(); ctxE.arc(20, 35, 5, 0, Math.PI * 2); ctxE.arc(40, 35, 5, 0, Math.PI * 2); ctxE.fill();
            ctxE.restore();
        }

        function drawBullet(ctxB, x, y, w, h) {
            ctxB.fillStyle = '#ffff00'; ctxB.shadowBlur = 10; ctxB.shadowColor = "orange";
            ctxB.fillRect(x, y, w, h); ctxB.shadowBlur = 0;
        }

        function drawBoss1(ctx1, x, y, w, h) {
            ctx1.save(); ctx1.translate(x, y); ctx1.scale(w / 80, h / 80);
            ctx1.fillStyle = 'purple';
            ctx1.beginPath(); ctx1.ellipse(40, 40, 35, 25, 0, 0, Math.PI * 2); ctx1.fill();
            ctx1.fillStyle = '#00ff00';
            ctx1.beginPath(); ctx1.arc(25, 45, 5, 0, Math.PI * 2); ctx1.arc(55, 45, 5, 0, Math.PI * 2); ctx1.fill();
            ctx1.fillStyle = 'darkmagenta'; ctx1.fillRect(30, 15, 20, 15);
            ctx1.restore();
        }

        function drawBoss2(ctx2, x, y, w, h) {
            ctx2.save(); ctx2.translate(x, y); ctx2.scale(w / 80, h / 80);
            ctx2.fillStyle = '#8B0000';
            ctx2.beginPath(); ctx2.moveTo(40, 10); ctx2.lineTo(75, 40); ctx2.lineTo(60, 70); ctx2.lineTo(20, 70); ctx2.lineTo(5, 40); ctx2.fill();
            ctx2.fillStyle = 'yellow';
            ctx2.beginPath(); ctx2.moveTo(25, 50); ctx2.lineTo(35, 45); ctx2.lineTo(30, 55); ctx2.fill();
            ctx2.beginPath(); ctx2.moveTo(55, 50); ctx2.lineTo(45, 45); ctx2.lineTo(50, 55); ctx2.fill();
            ctx2.restore();
        }

        function drawBoss3(ctx3, x, y, w, h) {
            ctx3.save(); ctx3.translate(x, y); ctx3.scale(w / 80, h / 80);
            ctx3.fillStyle = '#FFD700'; ctx3.fillRect(10, 20, 60, 40);
            ctx3.beginPath(); ctx3.moveTo(10, 20); ctx3.lineTo(40, 5); ctx3.lineTo(70, 20); ctx3.fill();
            ctx3.beginPath(); ctx3.moveTo(10, 60); ctx3.lineTo(40, 75); ctx3.lineTo(70, 60); ctx3.fill();
            ctx3.fillStyle = 'red'; ctx3.beginPath(); ctx3.arc(40, 40, 12, 0, Math.PI * 2); ctx3.fill();
            ctx3.fillStyle = 'black'; ctx3.beginPath(); ctx3.arc(40, 40, 5, 0, Math.PI * 2); ctx3.fill();
            ctx3.restore();
        }

        function drawExplosion(ctxEx, x, y, size, alpha) {
            ctxEx.save(); ctxEx.globalAlpha = alpha; ctxEx.translate(x, y);
            const spikes = 8, outer = size / 2, inner = size / 4;
            ctxEx.fillStyle = '#ff8800'; ctxEx.beginPath();
            ctxEx.moveTo(outer, 0); // 경로의 첫 시작점 명시
            for (let i = 0; i < spikes * 2; i++) {
                let radius = i % 2 === 0 ? outer : inner;
                let angle = (i * Math.PI) / spikes;
                ctxEx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
            }
            ctxEx.closePath(); ctxEx.fill();
            ctxEx.fillStyle = 'yellow'; ctxEx.beginPath(); ctxEx.arc(0, 0, inner * 0.8, 0, Math.PI * 2); ctxEx.fill();
            ctxEx.restore();
        }

        let score = 0, lives = 3, bombs = 3, gameOver = false, gameStarted = false; 
        const player = { x: 0, y: 0, width: 35, height: 35, speed: 6 };

        let bullets = [], enemies = [], explosions = [], bossBullets = [], stars = [], planets = [], items = [];
        let weaponLevel = 1, invincibilityTimer = 0; 

        // ⭐ 난이도 중간 설정
        const bossStages = [
            { scoreReq: 200, hp: 200, speedX: 3, drawFunc: drawBoss1, bulletFreq: 0.05, spread: 3, bulletSpeed: 4.5 },  
            { scoreReq: 600, hp: 500, speedX: 4.5, drawFunc: drawBoss2, bulletFreq: 0.10, spread: 5, bulletSpeed: 6 }, 
            { scoreReq: 1200, hp: 1000, speedX: 6, drawFunc: drawBoss3, bulletFreq: 0.20, spread: 7, bulletSpeed: 7.5 }  
        ];

        let currentBossIndex = 0, boss = null, bossActive = false, gameClear = false, flashAlpha = 0;
        let rightPressed = false, leftPressed = false, upPressed = false, downPressed = false;
        let spacePressed = false, fireCooldown = 0;     

        // 화면 자동 리사이징 함수
        function resizeCanvas() {
            const paddingY = isTouchDevice ? 220 : 120;
            let newWidth = window.innerWidth > 550 ? 500 : window.innerWidth * 0.95;
            let newHeight = window.innerHeight - paddingY;
            if (newHeight > 800) newHeight = 800; 

            canvas.width = newWidth;
            canvas.height = newHeight;

            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height - 20;
            if (player.x > canvas.width - player.width) player.x = canvas.width / 2 - player.width / 2;
        }
        window.addEventListener('resize', resizeCanvas);

        // 배경 별 세팅
        for (let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random() * 2 + 0.5, speed: Math.random() * 3 + 1, alpha: Math.random() });
        }

        startBtn.addEventListener('click', () => {
            lobbyScreen.style.display = 'none'; 
            uiBoard.style.display = 'block';    
            canvas.style.display = 'block'; 
            
            if (isTouchDevice) {
                mobileControls.style.display = 'flex'; 
                pcInstructions.style.display = 'none';
            } else {
                mobileControls.style.display = 'none'; 
                pcInstructions.style.display = 'block';
            }
            
            resizeCanvas(); 
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 60;
            
            gameStarted = true; updateUI(); gameLoop(); 
        });

        restartBtn.addEventListener('click', () => { location.reload(); });

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return; 
            if ([' ', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
            if (e.key === 'ArrowRight') rightPressed = true;
            if (e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'ArrowUp') upPressed = true;
            if (e.key === 'ArrowDown') downPressed = true;
            if (e.key === ' ') spacePressed = true;
            if ((e.key === 'b' || e.key === 'B' || e.key === 'ㅠ') && !gameOver && !gameClear && bombs > 0) useBomb();
        }, { passive: false });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted) return;
            if (e.key === 'ArrowRight') rightPressed = false;
            if (e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'ArrowUp') upPressed = false;
            if (e.key === 'ArrowDown') downPressed = false;
            if (e.key === ' ') spacePressed = false;
        });

        const btnLeft = document.getElementById('btnLeft'), btnRight = document.getElementById('btnRight');
        const btnUp = document.getElementById('btnUp'), btnDown = document.getElementById('btnDown');
        const btnFire = document.getElementById('btnFire'), btnBomb = document.getElementById('btnBomb');

        const addTouch = (btn, pressTrue, pressFalse) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); pressTrue(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); pressFalse(); });
            btn.addEventListener('mousedown', pressTrue); btn.addEventListener('mouseup', pressFalse); btn.addEventListener('mouseleave', pressFalse);
        };
        addTouch(btnLeft, () => leftPressed = true, () => leftPressed = false);
        addTouch(btnRight, () => rightPressed = true, () => rightPressed = false);
        addTouch(btnUp, () => upPressed = true, () => upPressed = false);
        addTouch(btnDown, () => downPressed = true, () => downPressed = false);
        addTouch(btnFire, () => spacePressed = true, () => spacePressed = false);

        const triggerBomb = (e) => { if(e) e.preventDefault(); if(gameStarted && !gameOver && !gameClear && bombs > 0) useBomb(); };
        btnBomb.addEventListener('touchstart', triggerBomb); btnBomb.addEventListener('mousedown', triggerBomb);

        function updateUI() {
            let hearts = ''; for (let i = 0; i < lives; i++) hearts += '❤️';
            let bombIcons = ''; for (let i = 0; i < bombs; i++) bombIcons += '💣';
            scoreElement.innerText = `점수: ${score}`;
            lifeElement.innerText = `생명: ${hearts}`;
            bombElement.innerText = `폭탄(B): ${bombIcons}`;
        }

        function createExplosion(x, y, sizeMultiplier = 1) {
            explosions.push({ x: x, y: y, timer: 15, maxTimer: 15, size: sizeMultiplier });
        }

        function useBomb() {
            bombs--; updateUI(); flashAlpha = 1; 
            enemies.forEach(enemy => { createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2); spawnItemFromEnemy(enemy.x, enemy.y); score += 10; });
            enemies = []; bossBullets = []; 
            if (bossActive && boss) {
                boss.hp -= 50; createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, 3);
                if (boss.hp <= 0) defeatBoss();
            }
        }

        function getRandomItemType() {
            let rand = Math.random();
            if (rand < 0.15) return 'life';      
            if (rand < 0.30) return 'bomb';      
            if (rand < 0.45) return 'shield';    
            if (rand < 0.60) return 'speed';     
            if (rand < 0.75) return 'coin';      
            return 'power';                      
        }

        function spawnItemFromEnemy(x, y) {
            if (Math.random() < 0.20) items.push({ x: x, y: y, width: 30, height: 30, speed: 2, type: getRandomItemType() });
        }

        let itemTimer = 0;
        function spawnItem() {
            itemTimer++;
            if (itemTimer % 350 === 0) items.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 30, height: 30, speed: 2, type: getRandomItemType() });
        }

        let enemyTimer = 0;
        function spawnEnemy() {
            if (!bossActive) {
                enemyTimer++;
                if (enemyTimer % 30 === 0) enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 30, height: 30, speed: 2 + Math.random() * 2.5 });
            }
        }

        function spawnPlanet() {
            if (Math.random() < 0.01 && planets.length < 2) planets.push({ x: Math.random() * canvas.width, y: -100, radius: Math.random() * 40 + 20, speed: Math.random() * 0.5 + 0.2, color: `hsl(${Math.random() * 360}, 60%, 30%)` });
        }

        function spawnBoss(stageData) {
            bossActive = true;
            boss = { 
                x: canvas.width / 2 - 40, y: -100, width: 80, height: 80, 
                hp: stageData.hp, maxHp: stageData.hp, speedX: stageData.speedX, speedY: 2.5,
                drawFunc: stageData.drawFunc, bulletFreq: stageData.bulletFreq, spread: stageData.spread, bulletSpeed: stageData.bulletSpeed
            };
        }

        function defeatBoss() {
            createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, 5);
            score += 300 * (currentBossIndex + 1); currentBossIndex++; 
            bossActive = false; boss = null; bossBullets = []; 
            
            if (currentBossIndex >= bossStages.length && !gameClear) {
                gameClear = true;
                setTimeout(() => { 
                    resultScreen.style.display = 'flex';
                    resultTitle.innerText = '🌟 GOD OF SPACE 🌟';
                    resultTitle.style.color = '#FFD700';
                    resultTitle.style.textShadow = '0 0 20px #FFA500';
                    resultScore.innerText = `최종 점수: ${score}점`;
                }, 1500);
            }
            updateUI();
        }

        function isColliding(rect1, rect2) {
            return ( rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y );
        }

        function playerTakeDamage() {
            createExplosion(player.x + player.width/2, player.y + player.height/2); 
            lives--; weaponLevel = 1; player.speed = 6; updateUI();
            
            if (lives <= 0 && !gameOver) {
                gameOver = true;
                setTimeout(() => { 
                    resultScreen.style.display = 'flex';
                    resultTitle.innerText = '💀 YOU DIED 💀';
                    resultTitle.style.color = '#ff3333';
                    resultTitle.style.textShadow = '0 0 20px #ff0000';
                    resultScore.innerText = `최종 점수: ${score}점`;
                }, 1000);
            } else if (lives > 0) {
                invincibilityTimer = 60; 
            }
        }

        function update() {
            if (gameOver || gameClear) return;
            
            if (invincibilityTimer > 0) invincibilityTimer--;

            if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
            if (leftPressed && player.x > 0) player.x -= player.speed;
            if (upPressed && player.y > 0) player.y -= player.speed;
            if (downPressed && player.y < canvas.height - player.height) player.y += player.speed;
            
            if (fireCooldown > 0) fireCooldown--; 
            if (spacePressed && fireCooldown <= 0) {
                if (weaponLevel === 1) {
                    bullets.push({ x: player.x + player.width / 2 - 5, y: player.y, width: 10, height: 20, speed: 8, speedX: 0 });
                } else if (weaponLevel === 2) {
                    bullets.push({ x: player.x, y: player.y, width: 10, height: 20, speed: 8, speedX: 0 });
                    bullets.push({ x: player.x + player.width - 10, y: player.y, width: 10, height: 20, speed: 8, speedX: 0 });
                } else {
                    bullets.push({ x: player.x + player.width / 2 - 5, y: player.y, width: 10, height: 20, speed: 8, speedX: 0 });
                    bullets.push({ x: player.x, y: player.y + 10, width: 10, height: 20, speed: 8, speedX: -2 }); 
                    bullets.push({ x: player.x + player.width - 10, y: player.y + 10, width: 10, height: 20, speed: 8, speedX: 2 }); 
                }
                fireCooldown = 5; 
            }
            if (flashAlpha > 0) flashAlpha -= 0.05;

            for (let i = 0; i < stars.length; i++) {
                stars[i].y += stars[i].speed; if (stars[i].y > canvas.height) { stars[i].y = 0; stars[i].x = Math.random() * canvas.width; }
            }
            spawnPlanet();
            for (let i = 0; i < planets.length; i++) {
                planets[i].y += planets[i].speed; if (planets[i].y - planets[i].radius > canvas.height) { planets.splice(i, 1); i--; }
            }

            if (currentBossIndex < bossStages.length && score >= bossStages[currentBossIndex].scoreReq && !bossActive) spawnBoss(bossStages[currentBossIndex]);
            
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].y -= bullets[i].speed; bullets[i].x += bullets[i].speedX; 
                if (bullets[i].y < 0 || bullets[i].x < 0 || bullets[i].x > canvas.width) { bullets.splice(i, 1); i--; }
            }
            
            for (let i = 0; i < explosions.length; i++) {
                explosions[i].timer--; if (explosions[i].timer <= 0) { explosions.splice(i, 1); i--; }
            }

            spawnItem();
            for (let i = 0; i < items.length; i++) {
                items[i].y += items[i].speed;
                if (isColliding(player, items[i])) {
                    if (items[i].type === 'life') lives++;
                    else if (items[i].type === 'bomb') bombs++;
                    else if (items[i].type === 'power') weaponLevel = Math.min(weaponLevel + 1, 3); 
                    else if (items[i].type === 'shield') invincibilityTimer = 300; 
                    else if (items[i].type === 'speed') player.speed = Math.min(player.speed + 1.5, 12); 
                    else if (items[i].type === 'coin') score += 500; 
                    
                    createExplosion(items[i].x + 15, items[i].y + 15, 0.5); 
                    updateUI(); items.splice(i, 1); i--; continue;
                }
                if (items[i].y > canvas.height) { items.splice(i, 1); i--; }
            }

            spawnEnemy();
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;
                if (isColliding(player, enemies[i])) { 
                    if (invincibilityTimer <= 0) playerTakeDamage(); 
                    else { createExplosion(enemies[i].x + 15, enemies[i].y + 15); score += 10; updateUI(); }
                    enemies.splice(i, 1); i--; continue; 
                }

                let enemyDestroyed = false;
                for (let j = 0; j < bullets.length; j++) {
                    if (isColliding(bullets[j], enemies[i])) {
                        createExplosion(enemies[i].x + 15, enemies[i].y + 15);
                        spawnItemFromEnemy(enemies[i].x, enemies[i].y);
                        enemies.splice(i, 1); bullets.splice(j, 1); score += 10; updateUI(); enemyDestroyed = true; break;
                    }
                }
                if (enemyDestroyed) { i--; continue; }
                if (enemies[i] && enemies[i].y > canvas.height) { enemies.splice(i, 1); i--; }
            }

            if (bossActive && boss) {
                if (boss.y < 50) boss.y += boss.speedY; 
                else {
                    boss.x += boss.speedX;
                    if (boss.x <= 0 || boss.x + boss.width >= canvas.width) boss.speedX *= -1;
                    if (Math.random() < boss.bulletFreq) {
                        const cx = boss.x + boss.width / 2 - 5, by = boss.y + boss.height, sy = boss.bulletSpeed;
                        if (boss.spread === 1) {
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 0, speedY: sy });
                        } else if (boss.spread === 3) {
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: -2.5, speedY: sy });
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 0, speedY: sy });
                            bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: 2.5, speedY: sy });
                        } else if (boss.spread === 5) {
                            for(let k = -2; k <= 2; k++) bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: k * 2, speedY: sy });
                        } else if (boss.spread === 7) { 
                            for(let k = -3; k <= 3; k++) bossBullets.push({ x: cx, y: by, width: 10, height: 10, speedX: k * 2, speedY: sy });
                        }
                    }
                }
                for (let j = 0; j < bullets.length; j++) {
                    if (isColliding(bullets[j], boss)) {
                        boss.hp -= 10; createExplosion(bullets[j].x, bullets[j].y, 0.5); bullets.splice(j, 1); j--;
                        if (boss.hp <= 0) { defeatBoss(); break; }
                    }
                }
                if (boss && isColliding(player, boss) && invincibilityTimer <= 0) playerTakeDamage();
            }
            
            for (let i = 0; i < bossBullets.length; i++) {
                bossBullets[i].x += bossBullets[i].speedX; bossBullets[i].y += bossBullets[i].speedY;
                if (isColliding(bossBullets[i], player)) { 
                    bossBullets.splice(i, 1); if (invincibilityTimer <= 0) playerTakeDamage(); 
                    i--; continue; 
                }
                if (bossBullets[i] && bossBullets[i].y > canvas.height) { bossBullets.splice(i, 1); i--; }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 별 그리기
            stars.forEach(star => { ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`; ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill(); });
            
            // 행성 그리기
            planets.forEach(planet => {
                ctx.fillStyle = planet.color; ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(planet.x - planet.radius * 0.3, planet.y - planet.radius * 0.3, planet.radius * 0.2, 0, Math.PI * 2); ctx.fill();
            });

            // 플레이어 그리기 (무적 보호막 포함)
            if (!gameOver) {
                drawPlayerJet(ctx, player.x, player.y, player.width, player.height);
                if (invincibilityTimer > 0) {
                    ctx.beginPath(); ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${0.3 + Math.sin(Date.now() / 100) * 0.2})`; ctx.fill();
                    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
                }
            }
            
            // 총알 및 적 그리기
            bullets.forEach(b => drawBullet(ctx, b.x, b.y, b.width, b.height));
            enemies.forEach(e => drawEnemy(ctx, e.x, e.y, e.width, e.height));

            // 아이템 그리기
            items.forEach(item => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(item.x + 15, item.y + 15, 15, 0, Math.PI * 2); ctx.fill();
                ctx.font = '18px Arial'; ctx.textAlign = 'center';
                let icon = '⚡'; 
                if (item.type === 'life') icon = '❤️'; else if (item.type === 'bomb') icon = '💣';
                else if (item.type === 'shield') icon = '🛡️'; else if (item.type === 'speed') icon = '💨'; else if (item.type === 'coin') icon = '💰';
                ctx.fillText(icon, item.x + 15, item.y + 21);
            });

            // 보스 및 보스 총알 그리기
            ctx.fillStyle = '#ff00ff';
            bossBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x + b.width/2, b.y + b.height/2, b.width/2, 0, Math.PI * 2); ctx.fill(); });

            if (bossActive && boss) {
                boss.drawFunc(ctx, boss.x, boss.y, boss.width, boss.height);
                ctx.fillStyle = 'black'; ctx.fillRect(boss.x, boss.y - 15, boss.width, 10);
                ctx.fillStyle = 'red'; const hpWidth = (boss.hp / boss.maxHp) * boss.width;
                if(hpWidth > 0) ctx.fillRect(boss.x, boss.y - 15, hpWidth, 10);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`🔥 STAGE ${currentBossIndex + 1} BOSS 🔥`, boss.x + boss.width / 2, boss.y - 25);
            }

            // 폭발 효과 그리기
            explosions.forEach(exp => {
                const size = (exp.maxTimer - exp.timer) * 4 * exp.size; const alpha = exp.timer / exp.maxTimer;
                drawExplosion(ctx, exp.x + 15, exp.y + 15, size, alpha);
            });

            // 폭탄 사용 시 섬광 효과
            if (flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            // 게임 오버 문구 출력 (배경 결과창이 뜨기 전 잠깐 보여주는 용도)
            if (gameOver && resultScreen.style.display === 'none') {
                ctx.fillStyle = 'red'; ctx.font = 'bold 45px Arial'; ctx.textAlign = 'center'; 
                ctx.fillText('YOU DIED', canvas.width / 2, canvas.height / 2);
            }
        }

        // 반복 실행 루프
        function gameLoop() { 
            update(); 
            draw(); 
            if ((!gameOver && !gameClear) || explosions.length > 0) {
                requestAnimationFrame(gameLoop); 
            }
        }
    </script>
</body>
